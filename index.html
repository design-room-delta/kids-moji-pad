<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>おしゃべりもじぱっど</title>
  <meta name="description" content="こどもが じぶんで もじを おぼえたり、こえで あそべる もじがくしゅうアプリです。" />
  <meta name="theme-color" content="#ff8fa3" />

  <!-- ブラウザタブのアイコン -->
  <link rel="icon" type="image/png" sizes="192x192" href="img/mojipad_icon_192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="img/mojipad_icon_512.png" />

  <!-- ホーム画面に追加した時のアイコン(iOS/Android) -->
  <link rel="apple-touch-icon" href="img/mojipad_icon_192.png" />
  <link rel="manifest" href="manifest.json" />

  <!-- SNSなどでリンクを共有した時のプレビュー -->
  <meta property="og:title" content="おしゃべりもじぱっど" />
  <meta property="og:description" content="こどもが じぶんで もじを おぼえたり、こえで あそべる もじがくしゅうアプリです。" />
  <meta property="og:image" content="https://design-room-delta.github.io/kids-moji-pad/img/mojipad_icon_512.png" />
  <meta property="og:type" content="website" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="splash" class="splash" aria-hidden="true">
    <img src="img/mojipad_icon_512.png" alt="" class="splash-icon" />
  </div>

  <div class="app">
    <h1 class="title">おしゃべりもじぱっど</h1>

    <!-- 上部：入力欄と操作ボタン -->
    <section class="input-area">
      <div id="textDisplay" class="text-display" data-placeholder="もじを　おしてみてね">
        <span id="textChars" class="text-chars"></span>
        <span id="highlightMarker" class="highlight-marker" aria-hidden="true"></span>
      </div>
      <div class="input-buttons">
        <button id="deleteBtn" class="ctrl-btn delete-btn" aria-label="さいごの もじを けす">
          <span class="ctrl-icon">×</span>
          <span class="ctrl-label">けす</span>
        </button>
        <button id="playBtn" class="ctrl-btn play-btn" aria-label="よみあげる">
          <span class="ctrl-icon">🔊</span>
          <span class="ctrl-label">よむ</span>
        </button>
        <button id="micBtn" class="ctrl-btn mic-btn" aria-label="こえで にゅうりょく">
          <span class="ctrl-icon">🎤</span>
          <span class="ctrl-label">はなす</span>
        </button>
      </div>
      <div id="statusBar" class="status-bar" aria-live="polite"></div>
    </section>

    <!-- 切替ボタン -->
    <section class="mode-area">
      <button id="modeToggle" class="mode-toggle">
        <span class="mode-toggle-track">
          <span class="mode-toggle-option" data-mode="hiragana">ひらがな</span>
          <span class="mode-toggle-option" data-mode="katakana">カタカナ</span>
          <span class="mode-toggle-thumb"></span>
        </span>
      </button>
    </section>

    <!-- 中央：もじ表 -->
    <main id="kanaTable" class="kana-table"></main>

    <footer class="hint">
      もじを　おすと　こえが　でるよ
    </footer>
  </div>

  <script src="kana-data.js"></script>
  <script src="kanji-readings.js"></script>
  <script src="script.js"></script>
</body>
</html>
